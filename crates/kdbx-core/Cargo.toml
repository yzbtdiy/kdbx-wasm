[package]
name = "kdbx-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "KDBX 4 password database parser core library"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "serde", "js"] }
flate2 = "1.1.0"
thiserror = "2.0.12"
aes = "0.8.4"
chacha20 = "0.9.1"
argon2 = "0.5.3"
hmac = "0.12.1"
sha2 = "0.10.8"
cipher = "0.4.4"
cbc = "0.1.2"
base64 = "0.22.1"
roxmltree = "0.20.0"
chrono = { version = "0.4.40", features = ["serde"] }
byteorder = "1.5.0"
rand = "0.9.0"
zeroize = { version = "1.8.1", features = ["derive"] }
getrandom = "0.3.4"
tracing = "0.1.41"

[dev-dependencies]
hex = "0.4.3"
