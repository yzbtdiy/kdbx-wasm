<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kdbx-wasm Example</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #333;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    input[type="password"] {
      padding: 8px;
      margin: 10px 0;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #output {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .entry {
      margin: 10px 0;
      padding: 10px;
      background: #f9f9f9;
      border-left: 3px solid #007bff;
    }
    .entry-title {
      font-weight: bold;
      color: #007bff;
    }
    .entry-field {
      margin: 5px 0;
    }
    .error {
      color: #dc3545;
    }
    .success {
      color: #28a745;
    }
  </style>
</head>
<body>
  <h1>KDBX Parser Example</h1>
  
  <div class="section">
    <h2>Load KDBX File</h2>
    <input type="file" id="kdbxFile" accept=".kdbx">
    <br>
    <input type="password" id="password" placeholder="Master password (optional)">
    <br>
    <button id="loadBtn" disabled>Load Database</button>
    <button id="infoBtn" disabled>Get File Info</button>
  </div>

  <div class="section">
    <h2>Search</h2>
    <input type="text" id="searchQuery" placeholder="Search entries...">
    <button id="searchBtn" disabled>Search</button>
  </div>

  <div class="section">
    <h2>Output</h2>
    <div id="output">Select a KDBX file to begin...</div>
  </div>

  <script type="module">
    import { KdbxDatabase, isKdbxFile, getFileInfo } from 'kdbx-wasm';

    let currentDb = null;
    let fileData = null;

    const kdbxFile = document.getElementById('kdbxFile');
    const password = document.getElementById('password');
    const loadBtn = document.getElementById('loadBtn');
    const infoBtn = document.getElementById('infoBtn');
    const searchQuery = document.getElementById('searchQuery');
    const searchBtn = document.getElementById('searchBtn');
    const output = document.getElementById('output');

    kdbxFile.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      fileData = new Uint8Array(arrayBuffer);

      if (isKdbxFile(fileData)) {
        output.innerHTML = '<span class="success">Valid KDBX file detected!</span>';
        loadBtn.disabled = false;
        infoBtn.disabled = false;
      } else {
        output.innerHTML = '<span class="error">Not a valid KDBX file!</span>';
        loadBtn.disabled = true;
        infoBtn.disabled = true;
      }
    });

    infoBtn.addEventListener('click', () => {
      if (!fileData) return;

      try {
        const info = getFileInfo(fileData);
        output.innerHTML = '<h3>File Information</h3>' +
          `<p><strong>Version:</strong> ${info.version}</p>` +
          `<p><strong>Encryption:</strong> ${info.encryptionAlgorithm}</p>` +
          `<p><strong>KDF:</strong> ${info.kdfAlgorithm}</p>` +
          `<p><strong>Compression:</strong> ${info.compression}</p>`;
      } catch (err) {
        output.innerHTML = `<span class="error">Error: ${err.message}</span>`;
      }
    });

    loadBtn.addEventListener('click', () => {
      if (!fileData) return;

      try {
        const pwd = password.value || undefined;
        currentDb = new KdbxDatabase(fileData, pwd);
        
        const headerInfo = currentDb.headerInfo;
        const metadata = currentDb.metadata;
        
        let html = '<h3>Database Loaded Successfully!</h3>';
        html += `<p><strong>Database Name:</strong> ${metadata.databaseName || 'N/A'}</p>`;
        html += `<p><strong>Entries:</strong> ${headerInfo.entryCount}</p>`;
        html += `<p><strong>Groups:</strong> ${headerInfo.groupCount}</p>`;
        html += `<p><strong>Encryption:</strong> ${headerInfo.encryptionAlgorithm}</p>`;
        html += `<p><strong>KDF:</strong> ${headerInfo.kdfAlgorithm}</p>`;
        
        // Show first 5 entries
        const entries = currentDb.getEntries().slice(0, 5);
        if (entries.length > 0) {
          html += '<h4>First 5 Entries:</h4>';
          entries.forEach(entry => {
            html += `<div class="entry">` +
              `<div class="entry-title">${escapeHtml(entry.title)}</div>` +
              `<div class="entry-field">Username: ${escapeHtml(entry.username || 'N/A')}</div>` +
              `<div class="entry-field">URL: ${escapeHtml(entry.url || 'N/A')}</div>` +
              `</div>`;
          });
        }
        
        output.innerHTML = html;
        searchBtn.disabled = false;
      } catch (err) {
        output.innerHTML = `<span class="error">Error loading database: ${escapeHtml(err.message)}</span>`;
        currentDb = null;
        searchBtn.disabled = true;
      }
    });

    searchBtn.addEventListener('click', () => {
      if (!currentDb) return;

      const query = searchQuery.value;
      if (!query) return;

      try {
        const results = currentDb.searchEntries(query);
        
        let html = `<h3>Search Results (${results.length} found)</h3>`;
        if (results.length === 0) {
          html += '<p>No entries found.</p>';
        } else {
          results.slice(0, 10).forEach(entry => {
            html += `<div class="entry">` +
              `<div class="entry-title">${escapeHtml(entry.title)}</div>` +
              `<div class="entry-field">Username: ${escapeHtml(entry.username || 'N/A')}</div>` +
              `<div class="entry-field">URL: ${escapeHtml(entry.url || 'N/A')}</div>` +
              `</div>`;
          });
          if (results.length > 10) {
            html += `<p>... and ${results.length - 10} more</p>`;
          }
        }
        output.innerHTML = html;
      } catch (err) {
        output.innerHTML = `<span class="error">Error searching: ${escapeHtml(err.message)}</span>`;
      }
    });

    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
